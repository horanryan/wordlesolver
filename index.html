<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)">
    <meta name="description" content="A simple offline Wordle solver.">
    <title>Wordle Solver</title>
    <link rel="manifest" href="manifest.json">
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --page: #f7f7f4;
        --surface: #ffffff;
        --text: #202123;
        --muted: #6e6e63;
        --border: #d9d9d0;
        --tile-empty: #ffffff;
        --tile-filled: #202123;
        --tile-absent: #6b6b6b;
        --tile-present: #c9b458;
        --tile-correct: #10a37f;
        --button: #202123;
        --button-text: #ffffff;
        --secondary-button: #ecece5;
        --secondary-button-text: #202123;
        background: var(--page);
        color: var(--text);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px 16px calc(216px + env(safe-area-inset-bottom));
      }

      main {
        width: min(100%, 440px);
        margin: 0 auto;
      }

      h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.05;
        text-align: left;
        letter-spacing: 0;
      }

      p {
        margin: 12px 0 28px;
        color: var(--muted);
        line-height: 1.5;
        text-align: left;
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        padding: 20px;
      }

      h2 {
        margin: 0 0 14px;
        font-size: 13px;
        line-height: 1.2;
        text-transform: uppercase;
        letter-spacing: 0;
      }

      .tile {
        width: 56px;
        height: 56px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        background: var(--tile-empty);
        color: var(--text);
        font-size: 28px;
        font-weight: 600;
        line-height: 1;
        text-transform: uppercase;
      }

      .tile.absent,
      .tile.present,
      .tile.correct {
        border-color: transparent;
        color: #ffffff;
      }

      .tile.absent {
        background: var(--tile-absent);
      }

      .tile.present {
        background: var(--tile-present);
      }

      .tile.correct {
        background: var(--tile-correct);
      }

      input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: flex-end;
        margin-top: 16px;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        padding: 8px 18px;
        background: var(--button);
        color: var(--button-text);
        font: inherit;
        font-weight: 600;
        text-transform: none;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .secondary-button {
        background: var(--secondary-button);
        color: var(--secondary-button-text);
      }

      button:focus-visible,
      .guess-boxes:focus-visible {
        outline: 3px solid #10a37f;
        outline-offset: 2px;
      }

      .guess-boxes {
        display: grid;
        grid-template-columns: repeat(5, 56px);
        gap: 5px;
        justify-content: center;
        width: fit-content;
        margin: 0 auto;
        border: 0;
        padding: 0;
        background: transparent;
        cursor: text;
      }

      .guess-tile.filled:not(.absent):not(.present):not(.correct) {
        border-color: var(--tile-filled);
      }

      .keyboard {
        display: grid;
        gap: 8px;
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10;
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        padding: 10px 8px max(10px, env(safe-area-inset-bottom));
        background: var(--page);
        touch-action: manipulation;
        user-select: none;
      }

      .keyboard-row {
        display: grid;
        grid-template-columns: repeat(10, minmax(0, 1fr));
        gap: 5px;
      }

      .keyboard-row:nth-child(2) {
        padding: 0 5%;
      }

      .keyboard-row:nth-child(3) {
        grid-template-columns: 1.45fr repeat(7, minmax(0, 1fr)) 1.45fr;
      }

      .keyboard-key {
        min-width: 0;
        min-height: 58px;
        border-radius: 6px;
        padding: 0 4px;
        background: var(--secondary-button);
        color: var(--secondary-button-text);
        font-size: 16px;
        line-height: 1;
      }

      .keyboard-key[data-key="enter"],
      .keyboard-key[data-key="backspace"] {
        font-size: 12px;
      }

      .keyboard-key.absent,
      .keyboard-key.present,
      .keyboard-key.correct {
        color: #ffffff;
      }

      .keyboard-key.absent {
        background: var(--tile-absent);
      }

      .keyboard-key.present {
        background: var(--tile-present);
      }

      .keyboard-key.correct {
        background: var(--tile-correct);
      }

      .status {
        margin-top: 16px;
        color: var(--muted);
        font-size: 14px;
      }

      .suggestions {
        margin-top: 20px;
        border-top: 1px solid var(--border);
        padding-top: 16px;
      }

      .suggestion-label,
      .board-label {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .best-guess {
        margin: 0;
        font-size: 28px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .candidate-count {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .history {
        display: grid;
        gap: 5px;
        margin-bottom: 5px;
      }

      .history-row {
        display: grid;
        grid-template-columns: repeat(5, 56px);
        gap: 5px;
        justify-content: center;
      }

      .history-row .tile {
        width: 56px;
        height: 56px;
        font-size: 28px;
        cursor: pointer;
      }

      .history-row .tile:focus-visible {
        outline: 3px solid #10a37f;
        outline-offset: 2px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #171717;
          --surface: #212121;
          --text: #ececec;
          --muted: #b4b4a8;
          --border: #3f3f3f;
          --tile-empty: #171717;
          --tile-filled: #ececec;
          --tile-absent: #5f5f5f;
          --tile-present: #b59f3b;
          --tile-correct: #10a37f;
          --button: #ececec;
          --button-text: #171717;
          --secondary-button: #2f2f2f;
          --secondary-button-text: #ececec;
        }
      }

      @media (max-width: 380px) {
        .tile,
        .guess-boxes,
        .history-row {
          grid-template-columns: repeat(5, 48px);
        }

        .tile {
          width: 48px;
          height: 48px;
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Wordle Solver</h1>
      <p>A quiet offline helper for narrowing five-letter words.</p>

      <section class="panel" aria-labelledby="guess-heading">
        <h2 id="guess-heading">Guess</h2>
        <p class="board-label">Enter a word, then tap each box to mark the result.</p>
        <div class="history" id="history" aria-label="Submitted clues"></div>
        <form id="guess-form">
          <button class="guess-boxes" type="button" aria-label="Enter a five-letter guess">
            <span class="tile guess-tile" data-index="0" aria-hidden="true"></span>
            <span class="tile guess-tile" data-index="1" aria-hidden="true"></span>
            <span class="tile guess-tile" data-index="2" aria-hidden="true"></span>
            <span class="tile guess-tile" data-index="3" aria-hidden="true"></span>
            <span class="tile guess-tile" data-index="4" aria-hidden="true"></span>
          </button>
          <input id="guess" name="guess" maxlength="5" pattern="[A-Za-z]{5}" inputmode="text" autocomplete="off" aria-hidden="true" tabindex="-1">
          <div class="actions">
            <button class="secondary-button" id="undo-button" type="button" disabled>Undo</button>
          </div>
        </form>
        <div class="status" id="status" role="status">Ready to work offline after the first load.</div>
        <div class="suggestions" aria-live="polite">
          <p class="suggestion-label">Best next guess</p>
          <p class="best-guess" id="best-guess">-----</p>
          <p class="candidate-count" id="candidate-count">No clues entered yet.</p>
        </div>
      </section>
    </main>
    <div class="keyboard" aria-label="Word keyboard">
      <div class="keyboard-row">
        <button class="keyboard-key" type="button" data-key="q">Q</button>
        <button class="keyboard-key" type="button" data-key="w">W</button>
        <button class="keyboard-key" type="button" data-key="e">E</button>
        <button class="keyboard-key" type="button" data-key="r">R</button>
        <button class="keyboard-key" type="button" data-key="t">T</button>
        <button class="keyboard-key" type="button" data-key="y">Y</button>
        <button class="keyboard-key" type="button" data-key="u">U</button>
        <button class="keyboard-key" type="button" data-key="i">I</button>
        <button class="keyboard-key" type="button" data-key="o">O</button>
        <button class="keyboard-key" type="button" data-key="p">P</button>
      </div>
      <div class="keyboard-row">
        <button class="keyboard-key" type="button" data-key="a">A</button>
        <button class="keyboard-key" type="button" data-key="s">S</button>
        <button class="keyboard-key" type="button" data-key="d">D</button>
        <button class="keyboard-key" type="button" data-key="f">F</button>
        <button class="keyboard-key" type="button" data-key="g">G</button>
        <button class="keyboard-key" type="button" data-key="h">H</button>
        <button class="keyboard-key" type="button" data-key="j">J</button>
        <button class="keyboard-key" type="button" data-key="k">K</button>
        <button class="keyboard-key" type="button" data-key="l">L</button>
      </div>
      <div class="keyboard-row">
        <button class="keyboard-key" type="button" data-key="backspace" aria-label="Backspace">DEL</button>
        <button class="keyboard-key" type="button" data-key="z">Z</button>
        <button class="keyboard-key" type="button" data-key="x">X</button>
        <button class="keyboard-key" type="button" data-key="c">C</button>
        <button class="keyboard-key" type="button" data-key="v">V</button>
        <button class="keyboard-key" type="button" data-key="b">B</button>
        <button class="keyboard-key" type="button" data-key="n">N</button>
        <button class="keyboard-key" type="button" data-key="m">M</button>
        <button class="keyboard-key" type="button" data-key="enter">ENTER</button>
      </div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
