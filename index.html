<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)">
    <meta name="description" content="A simple offline Wordle solver.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Wordle Solver">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Wordle Solver</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, Helvetica, sans-serif;
        --page: #ffffff;
        --surface: #ffffff;
        --text: #000000;
        --muted: #5a5a5a;
        --border: #d3d6da;
        --divider: #d3d6da;
        --tile-filled: #878a8c;
        --tile-absent: #787c7e;
        --tile-present: #c9b458;
        --tile-correct: #6aaa64;
        --key: #d3d6da;
        --key-text: #000000;
        --focus: #346eb7;
        --tile-size: min(62px, calc((100vw - 48px) / 5));
        background: var(--page);
        color: var(--text);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        padding-bottom: calc(210px + env(safe-area-inset-bottom));
        background: var(--page);
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      .guess-boxes:focus-visible,
      .switch input:focus-visible + .switch-track {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .app-header {
        height: 55px;
        border-bottom: 1px solid var(--divider);
      }

      .header-inner {
        display: grid;
        grid-template-columns: 44px 1fr 44px;
        align-items: center;
        width: min(100%, 520px);
        height: 100%;
        margin: 0 auto;
        padding: 0 8px;
      }

      .wordmark {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 28px;
        font-weight: 700;
        line-height: 1;
        text-align: center;
        letter-spacing: -1px;
      }

      .wordmark span {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.6px;
        text-transform: uppercase;
      }

      .brand-tile {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        justify-self: center;
        background: var(--tile-correct);
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
      }

      main {
        width: min(100% - 28px, 420px);
        margin: 0 auto;
        padding-top: 18px;
      }

      .intro {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
        text-align: center;
      }

      .mode-panel {
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
        border-top: 1px solid var(--divider);
        border-bottom: 1px solid var(--divider);
        padding: 12px 2px;
      }

      .mode-copy {
        min-width: 0;
      }

      .mode-title {
        display: block;
        margin-bottom: 2px;
        font-size: 15px;
        font-weight: 700;
      }

      .mode-description {
        display: block;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.3;
      }

      .switch {
        position: relative;
        flex: 0 0 auto;
        width: 46px;
        height: 26px;
      }

      .switch input,
      #guess {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .switch-track {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: #878a8c;
        transition: background 160ms ease;
      }

      .switch-track::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 1px 3px rgb(0 0 0 / 30%);
        transition: transform 160ms ease;
      }

      .switch input:checked + .switch-track {
        background: var(--tile-correct);
      }

      .switch input:checked + .switch-track::after {
        transform: translateX(20px);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      .board-label {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      .history {
        display: grid;
        gap: 5px;
        margin-bottom: 5px;
      }

      .history-row,
      .guess-boxes {
        display: grid;
        grid-template-columns: repeat(5, var(--tile-size));
        gap: 5px;
        justify-content: center;
      }

      .tile {
        width: var(--tile-size);
        height: var(--tile-size);
        display: grid;
        place-items: center;
        touch-action: manipulation;
        border: 2px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: calc(var(--tile-size) * 0.52);
        font-weight: 700;
        line-height: 1;
        text-transform: uppercase;
        transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
      }

      .tile.absent,
      .tile.present,
      .tile.correct {
        border-color: transparent;
        color: #ffffff;
      }

      .tile.absent {
        background: var(--tile-absent);
      }

      .tile.present {
        background: var(--tile-present);
      }

      .tile.correct {
        background: var(--tile-correct);
      }

      .guess-boxes {
        width: fit-content;
        margin: 0 auto;
        border: 0;
        padding: 0;
        background: transparent;
        cursor: text;
      }

      .guess-tile.filled:not(.absent):not(.present):not(.correct) {
        border-color: var(--tile-filled);
      }

      .history-row .tile {
        cursor: pointer;
      }

      .actions {
        display: flex;
        justify-content: center;
        min-height: 34px;
        margin-top: 8px;
      }

      .secondary-button {
        min-height: 32px;
        border: 1px solid var(--divider);
        border-radius: 999px;
        padding: 4px 15px;
        background: var(--surface);
        color: var(--text);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }

      button:disabled {
        cursor: default;
        opacity: 0;
      }

      .suggestions {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        margin-top: 12px;
        border: 1px solid var(--tile-correct);
        border-left-width: 5px;
        border-radius: 8px;
        padding: 14px 16px;
        background: var(--surface);
      }

      .suggestion-label {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .best-guess {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .candidate-count {
        grid-column: 1 / -1;
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .results-grid {
        display: grid;
        gap: 10px;
        margin-top: 10px;
      }

      .results-panel {
        min-width: 0;
        border: 1px solid var(--divider);
        border-radius: 8px;
        padding: 12px;
        background: var(--surface);
      }

      .results-heading {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }

      .guess-recommendations {
        display: grid;
        gap: 6px;
      }

      .guess-recommendation {
        display: grid;
        grid-template-columns: 22px minmax(48px, auto) 1fr;
        align-items: center;
        gap: 9px;
        width: 100%;
        border: 1px solid var(--divider);
        border-radius: 5px;
        padding: 7px 9px;
        background: var(--surface);
        color: var(--text);
        text-align: left;
      }

      .guess-recommendation:hover {
        border-color: var(--tile-correct);
      }

      .recommendation-rank {
        display: grid;
        width: 20px;
        height: 20px;
        place-items: center;
        border-radius: 3px;
        background: var(--tile-correct);
        color: #ffffff;
        font-size: 11px;
        font-weight: 700;
      }

      .recommendation-word {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .recommendation-detail {
        color: var(--muted);
        font-size: 11px;
        text-align: right;
      }

      .possible-answers {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 22px;
        align-items: flex-start;
      }

      .possible-answer,
      .answers-overflow {
        border-radius: 3px;
        padding: 4px 6px;
        background: var(--key);
        color: var(--key-text);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }

      .answers-overflow {
        background: var(--tile-absent);
        color: #ffffff;
      }

      .status {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
        text-align: center;
      }

      .keyboard {
        --keyboard-gap: clamp(3px, 1.25vw, 6px);
        --keyboard-key-height: clamp(42px, min(7.2vh, 12vw), 58px);
        display: grid;
        gap: clamp(5px, 1.5vw, 8px);
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10;
        width: min(100%, 520px);
        margin: 0 auto;
        border-top: 1px solid var(--divider);
        padding: 10px clamp(4px, 2vw, 8px) max(8px, env(safe-area-inset-bottom));
        background: var(--page);
        box-shadow: 0 -4px 16px rgb(0 0 0 / 4%);
        touch-action: manipulation;
        user-select: none;
      }

      .keyboard-row {
        display: grid;
        grid-template-columns: repeat(10, minmax(0, 1fr));
        gap: var(--keyboard-gap);
      }

      .keyboard-row:nth-child(2) {
        width: 90%;
        margin-inline: auto;
        grid-template-columns: repeat(9, minmax(0, 1fr));
      }

      .keyboard-row:nth-child(3) {
        grid-template-columns: 1.5fr repeat(7, minmax(0, 1fr)) 1.5fr;
      }

      .keyboard-key {
        min-width: 0;
        min-height: var(--keyboard-key-height);
        border: 0;
        border-radius: 4px;
        padding: 0 3px;
        background: var(--key);
        color: var(--key-text);
        font-size: 13px;
        font-weight: 700;
        line-height: 1;
        text-transform: uppercase;
      }

      .keyboard-key[data-key="enter"] {
        font-size: 10px;
      }

      .keyboard-key[data-key="backspace"] {
        display: grid;
        place-items: center;
      }

      .keyboard-key[data-key="backspace"] svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }

      .keyboard-key.absent,
      .keyboard-key.present,
      .keyboard-key.correct {
        color: #ffffff;
      }

      .keyboard-key.absent {
        background: var(--tile-absent);
      }

      .keyboard-key.present {
        background: var(--tile-present);
      }

      .keyboard-key.correct {
        background: var(--tile-correct);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #121213;
          --surface: #121213;
          --text: #ffffff;
          --muted: #a8a8a8;
          --border: #3a3a3c;
          --divider: #3a3a3c;
          --tile-filled: #565758;
          --tile-absent: #3a3a3c;
          --tile-present: #b59f3b;
          --tile-correct: #538d4e;
          --key: #818384;
          --key-text: #ffffff;
          --focus: #85b6f2;
        }
      }

      @media (max-height: 720px) {
        :root {
          --tile-size: min(54px, calc((100vw - 48px) / 5));
        }

        main {
          padding-top: 10px;
        }

        .intro,
        .mode-panel {
          margin-bottom: 10px;
        }
      }

      @media (min-width: 520px) {
        .results-grid {
          grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
          align-items: start;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <span class="brand-tile" aria-hidden="true">W</span>
        <h1 class="wordmark">Wordle <span>Solver</span></h1>
        <span aria-hidden="true"></span>
      </div>
    </header>
    <main>
      <p class="intro">Enter your result, then get the strongest next guess.</p>

      <label class="mode-panel" for="hard-mode-toggle">
        <span class="mode-copy">
          <span class="mode-title">Hard Mode</span>
          <span class="mode-description">Greens stay put; yellows move to a new slot</span>
        </span>
        <span class="switch">
          <input id="hard-mode-toggle" type="checkbox" role="switch">
          <span class="switch-track" aria-hidden="true"></span>
        </span>
      </label>

      <section aria-labelledby="guess-heading">
        <h2 class="sr-only" id="guess-heading">Enter a guess</h2>
        <p class="board-label">Type a word · tap each tile to change its color</p>
        <div class="history" id="history" aria-label="Submitted clues"></div>
        <form id="guess-form">
          <button class="guess-boxes" type="button" aria-label="Enter a five-letter guess">
            <span class="tile guess-tile" data-index="0" aria-hidden="true"></span>
            <span class="tile guess-tile" data-index="1" aria-hidden="true"></span>
            <span class="tile guess-tile" data-index="2" aria-hidden="true"></span>
            <span class="tile guess-tile" data-index="3" aria-hidden="true"></span>
            <span class="tile guess-tile" data-index="4" aria-hidden="true"></span>
          </button>
          <input id="guess" name="guess" maxlength="5" pattern="[A-Za-z]{5}" inputmode="text" autocomplete="off" aria-hidden="true" tabindex="-1">
          <div class="actions">
            <button class="secondary-button" id="undo-button" type="button" disabled>Undo last</button>
          </div>
        </form>
        <div class="suggestions" aria-live="polite" aria-atomic="true">
          <p class="suggestion-label">Best next guess</p>
          <p class="best-guess" id="best-guess">-----</p>
          <p class="candidate-count" id="candidate-count">No clues entered yet.</p>
        </div>
        <div class="results-grid">
          <section class="results-panel" aria-labelledby="recommendations-heading">
            <h2 class="results-heading" id="recommendations-heading">Top next guesses</h2>
            <div class="guess-recommendations" id="guess-recommendations"></div>
          </section>
          <section class="results-panel" aria-labelledby="answers-heading">
            <h2 class="results-heading" id="answers-heading">Possible answers</h2>
            <div class="possible-answers" id="possible-answers" aria-live="polite"></div>
          </section>
        </div>
        <div class="status" id="status" role="status">Ready to work offline after the first load.</div>
      </section>
    </main>
    <div class="keyboard" aria-label="Word keyboard">
      <div class="keyboard-row">
        <button class="keyboard-key" type="button" data-key="q">Q</button>
        <button class="keyboard-key" type="button" data-key="w">W</button>
        <button class="keyboard-key" type="button" data-key="e">E</button>
        <button class="keyboard-key" type="button" data-key="r">R</button>
        <button class="keyboard-key" type="button" data-key="t">T</button>
        <button class="keyboard-key" type="button" data-key="y">Y</button>
        <button class="keyboard-key" type="button" data-key="u">U</button>
        <button class="keyboard-key" type="button" data-key="i">I</button>
        <button class="keyboard-key" type="button" data-key="o">O</button>
        <button class="keyboard-key" type="button" data-key="p">P</button>
      </div>
      <div class="keyboard-row">
        <button class="keyboard-key" type="button" data-key="a">A</button>
        <button class="keyboard-key" type="button" data-key="s">S</button>
        <button class="keyboard-key" type="button" data-key="d">D</button>
        <button class="keyboard-key" type="button" data-key="f">F</button>
        <button class="keyboard-key" type="button" data-key="g">G</button>
        <button class="keyboard-key" type="button" data-key="h">H</button>
        <button class="keyboard-key" type="button" data-key="j">J</button>
        <button class="keyboard-key" type="button" data-key="k">K</button>
        <button class="keyboard-key" type="button" data-key="l">L</button>
      </div>
      <div class="keyboard-row">
        <button class="keyboard-key" type="button" data-key="enter">ENTER</button>
        <button class="keyboard-key" type="button" data-key="z">Z</button>
        <button class="keyboard-key" type="button" data-key="x">X</button>
        <button class="keyboard-key" type="button" data-key="c">C</button>
        <button class="keyboard-key" type="button" data-key="v">V</button>
        <button class="keyboard-key" type="button" data-key="b">B</button>
        <button class="keyboard-key" type="button" data-key="n">N</button>
        <button class="keyboard-key" type="button" data-key="m">M</button>
        <button class="keyboard-key" type="button" data-key="backspace" aria-label="Backspace">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M22 3H7a2 2 0 0 0-1.6.8l-5 6.7a2.5 2.5 0 0 0 0 3l5 6.7A2 2 0 0 0 7 21h15a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Zm-2.6 13.2L18 17.6l-3.5-3.5L11 17.6l-1.4-1.4 3.5-3.5-3.5-3.5L11 7.8l3.5 3.5L18 7.8l1.4 1.4-3.5 3.5Z"/>
          </svg>
        </button>
      </div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
